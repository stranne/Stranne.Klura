<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `flutter build web --base-href /<repository>/` replaces this placeholder,
    so the app also works from a GitHub Pages repository path. Keep every
    other URL in this folder relative to it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!--
    Lets the page load files from this site only. CanvasKit is WebAssembly,
    which needs 'wasm-unsafe-eval', and Flutter adds styles to the page,
    which need 'unsafe-inline'. The hash is that of the one inline script
    `flutter run` adds in debug mode, `window.$dartRunMain();`, which starts
    the app; a release build has no such function, so the script does
    nothing there. GitHub Pages cannot send headers, so the policy is a meta
    tag, which cannot set frame-ancestors or reporting.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-MndvH2xoJITJx1vAmJTo0n71uGBofeMZfQTpl28Jz7s='; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">

  <meta name="description" content="Klura - small daily logic puzzles.">

  <!--
    Match the browser and the loading screen to the app theme so dark mode
    does not flash white while Flutter loads. The colors are the theme's
    surface and primary colors; test/app/web_shell_test.dart keeps them in
    sync with lib/app/klura_theme.dart.
  -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4FAFB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1415" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Klura">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">

  <title>Klura</title>

  <style>
    :root {
      --surface: #F4FAFB;
      --primary: #006970;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0E1415;
        --primary: #80D4DC;
      }
    }

    html,
    body {
      background: var(--surface);
      height: 100%;
      margin: 0;
    }

    #loading {
      color: var(--primary);
      display: grid;
      inset: 0;
      place-items: center;
      position: fixed;
    }

    /* Wait briefly before fading in, so fast loads show no loader at all. */
    #loading svg {
      animation: loading-appear 600ms ease-out 400ms both;
      height: 64px;
      width: 64px;
    }

    @keyframes loading-appear {
      from {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- flutter_bootstrap.js removes this once the app runs. -->
  <div id="loading">
    <svg viewBox="96 96 320 320" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="76" stroke-linecap="round">
        <path d="M160 136V376"/>
        <path d="M160 296L344 136"/>
      </g>
      <circle cx="338" cy="364" r="48" fill="currentColor"/>
    </svg>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
